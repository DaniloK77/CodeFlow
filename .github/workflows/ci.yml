name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  web:
    name: Web · lint, typecheck, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm run test:coverage
      - run: npm run build
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: coverage
          if-no-files-found: ignore

  python:
    name: API & codegrade · lint, test, quality gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: api/requirements-dev.txt
      - run: pip install -r api/requirements-dev.txt
      - name: Lint and format check (ruff)
        run: ruff check tools api scripts && ruff format --check tools api scripts
      - name: Unit and API tests (pytest)
        run: python -m pytest
      - name: Grade the codebase (fails below 90, the Excellent band)
        run: python -m tools.codegrade src tools api scripts --fail-under 90
      - name: Publish the report to the job summary
        if: always()
        run: |
          {
            echo '## codegrade report'
            echo '```'
            python -m tools.codegrade src tools api scripts --no-color --verbose
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
